name: Update Subscription

on:
  schedule:
    - cron: '0 */2 * * *'
  workflow_dispatch:

env:
  NUM_RUNNERS: 4
  THRESHOLD_MS: 350   # Max latency threshold in ms

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.split.outputs.matrix }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Fetch and Clean Candidates from Multi-Sources
        run: |
          python3 fetch_sources.py unique.txt
          echo "✅ Unique candidate configs ready: $(wc -l < unique.txt)"

      - name: Split configs into chunks
        id: split
        run: |
          total_lines=$(wc -l < unique.txt)
          chunk_size=$(( ($total_lines + $NUM_RUNNERS - 1) / $NUM_RUNNERS ))
          echo "Chunk size: $chunk_size"
          matrix_json="{\"runner\":["
          for i in $(seq 1 $NUM_RUNNERS); do
            matrix_json+="\"$i\""
            [ $i -lt $NUM_RUNNERS ] && matrix_json+=","
          done
          matrix_json+="]}"
          echo "matrix=$matrix_json" >> $GITHUB_OUTPUT
          mkdir -p share
          cp unique.txt share/unique.txt

      - name: Upload unique.txt
        uses: actions/upload-artifact@v4
        with:
          name: shared-unique
          path: share/
          retention-days: 1

  test:
    needs: prepare
    runs-on: ubuntu-latest
    strategy:
      matrix: ${{ fromJson(needs.prepare.outputs.matrix) }}
      fail-fast: false
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Download unique.txt
        uses: actions/download-artifact@v4
        with:
          name: shared-unique
          path: ./

      - name: Get my chunk of configs
        run: |
          total_lines=$(wc -l < unique.txt)
          chunk_size=$(( ($total_lines + $NUM_RUNNERS - 1) / $NUM_RUNNERS ))
          start_line=$(( (${{ matrix.runner }} - 1) * $chunk_size + 1 ))
          end_line=$(( ${{ matrix.runner }} * $chunk_size ))
          sed -n "${start_line},${end_line}p" unique.txt > my_chunk.txt
          echo "🔹 Runner ${{ matrix.runner }} testing $(wc -l < my_chunk.txt) configs"

      - name: Deep Connectivity & Handshake Test
        run: |
          python3 test_configs_final.py my_chunk.txt result_${{ matrix.runner }}.txt ${{ env.THRESHOLD_MS }}

      - name: Upload result chunk
        uses: actions/upload-artifact@v4
        with:
          name: result-chunk-${{ matrix.runner }}
          path: result_${{ matrix.runner }}.txt
          retention-days: 1

  publish:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Download all result chunks
        uses: actions/download-artifact@v4
        with:
          pattern: result-chunk-*
          path: chunks/
          merge-multiple: true

      - name: Merge, Deduplicate & Sort by Latency
        run: |
          if ls chunks/result_*.txt 1> /dev/null 2>&1; then
            cat chunks/result_*.txt | grep '://' > merged.txt
            python3 -c "
          import sys, base64
          lines = []
          seen = set()
          with open('merged.txt', 'r', encoding='utf-8', errors='ignore') as f:
              for line in f:
                  line = line.strip()
                  if not line or '://' not in line:
                      continue
                  base = line.split('#')[0].lower()
                  if base in seen:
                      continue
                  seen.add(base)
                  ms = 9999
                  if '|' in line and 'ms' in line:
                      try:
                          part = line.split('#')[-1]
                          for item in part.split('|'):
                              if 'ms' in item:
                                  digits = ''.join(filter(str.isdigit, item))
                                  if digits:
                                      ms = int(digits)
                                      break
                      except:
                          pass
                  lines.append((line, ms))
          lines.sort(key=lambda x: x[1])
          with open('subscription.txt', 'w', encoding='utf-8') as f:
              for l, _ in lines:
                  f.write(l + '\n')
          with open('subscription_b64.txt', 'wb') as f:
              f.write(base64.b64encode('\n'.join(l for l, _ in lines).encode('utf-8')))
          print(f'✅ Successfully merged, sorted, and generated subscription with {len(lines)} alive configs')
          "
          else
            echo "⚠️ No result files found!"
          fi

      - name: Commit and Push Changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add subscription.txt subscription_b64.txt
          if git diff --quiet && git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Auto-update subscription with verified low-latency configs [skip ci]"
            git pull --rebase origin main
            git push origin main
          fi
